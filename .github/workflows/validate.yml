name: Validate learning app
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check tests/validate-data.js
      - name: Validate question data and answer keys
        run: node tests/validate-data.js
